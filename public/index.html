<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Личный кабинет компании "Галс-телеком"</title>
  </head>
  <body>
    <style>
      .loader-start,
      .loader-start div {
        box-sizing: border-box;
        margin: 10px auto;
      }
      .loader-start {
        display: block;
        position: relative;
        width: 80px;
        height: 80px;
      }
      .loader-start div {
        display: inline-block;
        position: absolute;
        left: 8px;
        width: 16px;
        background: currentColor;
        animation: loader-start 1.2s cubic-bezier(0, 0.5, 0.5, 1) infinite;
      }
      .loader-start div:nth-child(1) {
        left: 8px;
        animation-delay: -0.24s;
      }
      .loader-start div:nth-child(2) {
        left: 32px;
        animation-delay: -0.12s;
      }
      .loader-start div:nth-child(3) {
        left: 56px;
        animation-delay: 0s;
      }
      @keyframes loader-start {
        0% {
          top: 8px;
          height: 64px;
        }
        50%, 100% {
          top: 24px;
          height: 32px;
        }
      }

      .loader-wrap {
        margin: 20% auto;
      }

      .loader-info {
        width: 100%;
        text-align: center;
      }
    </style>

    <noscript>You need to enable JavaScript to run this app.</noscript>

    <div class="loader-wrap">
      <p class="loader-info">Идет загрузка. Пожалуйста, подождите...</p>
      <div class="loader-start"><div></div><div></div><div></div></div>
    </div>

    <div id="root"></div>

  </body>
</html>
